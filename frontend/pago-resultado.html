<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estado del pago | EdwinGraphics</title>
  <link rel="stylesheet" href="assets/css/store.css">
  <link rel="stylesheet" href="assets/css/visual-refresh.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:#08090b;color:#f7f8fa;padding:24px}
    .payment-result{width:min(620px,100%);padding:clamp(24px,5vw,48px);background:#111318;border:1px solid #343741;border-radius:22px;text-align:center}
    .payment-result h1{font-size:clamp(28px,5vw,42px);margin:12px 0;color:#f1263d}
    .payment-result p{color:#b8bdc7;line-height:1.7}
    .payment-result a{display:inline-block;margin-top:18px;padding:14px 22px;border-radius:10px;background:#f1263d;color:#fff;font-weight:800;text-decoration:none}
    .payment-result code{overflow-wrap:anywhere;color:#fff}
  </style>
</head>
<body>
  <main class="payment-result">
    <span class="section-header-tag">EDWINGRAPHICS · PAGOS</span>
    <h1>Estamos verificando tu pago</h1>
    <p>Tu regreso desde la pasarela no confirma por sí solo que el pago haya sido aprobado. El estado definitivo se actualiza de forma segura cuando Wompi notifica al servidor.</p>
    <p id="paymentReference"></p>
    <a href="catalogo.html">Volver al catálogo</a>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const reference = params.get("reference");
    const transactionId = params.get("id");
    const message = document.getElementById("paymentReference");
    if (reference) message.textContent = "Referencia: " + reference;
    else if (transactionId) message.textContent = "Identificador de transacción: " + transactionId;
  </script>
</body>
</html>
