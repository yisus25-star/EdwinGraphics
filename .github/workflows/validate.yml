name: Validate EdwinGraphics
on:
  push:
    branches: [main, feature/tienda-redesign]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate JavaScript and migration files
        run: node scripts/check-project.js
